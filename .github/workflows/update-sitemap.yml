name: Update sitemap lastmod

# Regenerates <lastmod> in sitemap.xml and public/sitemap.xml from git mtime
# on every push to main, then commits the result back with [skip ci]. Paths
# filter + [skip ci] prevent self-triggering.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - 'public/sitemap.xml'
      - '.github/workflows/update-sitemap.yml'

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update_sitemap.py
        run: python3 scripts/update_sitemap.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet sitemap.xml public/sitemap.xml; then
            echo "sitemap.xml already in sync — no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml public/sitemap.xml
          git commit -m "chore(sitemap): auto-refresh <lastmod> from git mtime [skip ci]"
          git push
